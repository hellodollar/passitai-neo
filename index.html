<!DOCTYPE html>
<html lang="zh-CN" data-theme="neo">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>PassIt AI</title>
    <script>
      // 首屏防闪:渲染前应用外观偏好。键值与 src/constants/app.ts、composables/useAppearance.ts 保持同步。
      try {
        var preference = localStorage.getItem('passitai:appearance')
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'neo-dark' : 'neo')
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#1b1c20' : '#ffffff')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
